; Copy this file to env_secrets.ini (gitignored) and fill in your values.
; It is loaded by platformio.ini via extra_configs and passed in as build flags.

[secrets]
WIFI_SSID = your-ssid
WIFI_PASSWORD = your-password

[network]
; true = get an IP via DHCP, false = use the static settings below
USE_DHCP = false
STATIC_IP = 192.168.1.80
GATEWAY_IP = 192.168.1.1
SUBNET_MASK = 255.255.255.0

[leds]
NUM_LEDS = 100
; GPIO number, e.g. 2 = D4 (tentacle), 15 = D8 (test)
DATA_PIN = 15
