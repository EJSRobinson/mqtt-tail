[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
  fastled/FastLED @ ^3.6.0
; Values come from env_secrets.ini (gitignored) - copy env_secrets.example.ini to get started
build_src_flags =
  '-DWIFI_SSID="${secrets.WIFI_SSID}"'
  '-DWIFI_PASSWORD="${secrets.WIFI_PASSWORD}"'
  -DUSE_DHCP=${network.USE_DHCP}
  '-DSTATIC_IP="${network.STATIC_IP}"'
  '-DGATEWAY_IP="${network.GATEWAY_IP}"'
  '-DSUBNET_MASK="${network.SUBNET_MASK}"'
  -DCFG_NUM_LEDS=${leds.NUM_LEDS}
  -DCFG_DATA_PIN=${leds.DATA_PIN}
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
